<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, inital-scale=1.0">
        <title>Nebula Music - Registro</title>
    </head>
    <body>
        <main class="auth-container">
            <section class="auth-card">
                <form method="post" action="/crear-cuenta">
                    <label for="nombre"> Nombre: </label>
                    <input type="text" id="nombre" name="nombre" minlength="3"> <br><br>

                    <label for="correo"> Correo: </label>
                    <input type="email" id="correo" name="correo"> <br><br>

                    <label for="contrasenia"> Contraseña: </label>
                    <input type="password" id="contrasenia" name="contrasenia"> <br><br>

                    <label for="txt_pseudonimo"> Pseudonimo: </label>
                    <input type="text" id="txt_pseudonimo" name="txt_pseudonimo" pattern="[a-zA-Z]{3,10}-[0-9]{2,10}">
                    <br><br>

                    <input type="radio" id="gen_masculino" name="rad_genero">
                    <label for="gen_masculino">Masculino</label>

                    <input type="radio" id="gen_femenino" name="rad_genero">
                    <label for="gen_femenino">Femenino</label>

                    <input type="radio" id="gen_otro" name="rad_genero">
                    <label for="gen_otro">Otro</label><br><br>

                    <input type="select" id="sel_suscripcion" name="sel_suscripcion">
                    <label for="sel_suscripcion">(Gratis, Mensual, Anual)</label><br><br>

                    <input type="date" id="fechaNacimiento" name="fechaNacimiento">
                    <label for="fechaNacimiento">Fecha de Nacimiento</label><br><br>

                    <input type="checkbox" id="chk_terminos" name="chk_terminos">
                    <label for="chk_terminos">Aceptar Términos</label><br><br>

                    <input type="textarea" id="comentarios" name="comentarios">
                    <label for="comentarios">Comentarios</label><br><br>

                    <input type="submit">
                    <input type="reset">
                </form>

            </section>
        </main>
    </body>
</html>
